<script>
const CARICO = document.getElementById('payload').textContent.trim();
const ITER = 310000;
const esito = document.getElementById('esito');
const bottone = document.getElementById('bottone');

// La pagina è una fotografia: la ripubblica launchd due volte al giorno, ma se
// il Mac è spento resta ferma. Meglio dirlo prima di aprirla che lasciar credere
// che «oggi» nel deck sia davvero oggi.
(function freschezza() {
  const nodo = document.getElementById('freschezza');
  const scattata = new Date(nodo.dataset.giorno + 'T12:00:00');
  const oggi = new Date();
  oggi.setHours(12, 0, 0, 0);
  const giorni = Math.round((oggi - scattata) / 86400000);
  if (giorni < 1) return;
  nodo.hidden = false;
  if (giorni >= 3) nodo.dataset.grave = 'si';
  const quanti = giorni === 1 ? 'di ieri' : `di ${giorni} giorni fa`;
  nodo.textContent = `⚠️ Questa istantanea è ${quanti}: dentro il deck «oggi» `
    + `non è oggi. Si aggiorna da sola quando il Mac è acceso — se resta indietro, `
    + `il Mac era spento alle 07:00 e alle 14:30.`;
})();

function b64(testo) {
  const grezzo = atob(testo);
  const byte = new Uint8Array(grezzo.length);
  for (let i = 0; i < grezzo.length; i++) byte[i] = grezzo.charCodeAt(i);
  return byte;
}

async function apri(passphrase) {
  const dati = b64(CARICO);
  const materiale = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  const chiave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: dati.slice(0, 16), iterations: ITER, hash: 'SHA-256' },
    materiale, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const chiaro = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: dati.slice(16, 28) }, chiave, dati.slice(28)
  );
  return new TextDecoder().decode(chiaro);
}

document.getElementById('modulo').addEventListener('submit', async (evento) => {
  evento.preventDefault();
  const passphrase = document.getElementById('chiave').value;
  if (!passphrase) return;
  bottone.disabled = true;
  esito.dataset.stato = 'attesa';
  esito.textContent = 'Apertura…';
  try {
    const pagina = await apri(passphrase);
    document.open();
    document.write(pagina);
    document.close();
  } catch (errore) {
    bottone.disabled = false;
    esito.dataset.stato = 'errore';
    esito.textContent = 'Passphrase errata.';
    document.getElementById('chiave').select();
  }
});
</script>
